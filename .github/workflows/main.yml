name: Selenium CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 8 (Temurin)
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      # 3️⃣ Verify Java & Maven versions (Good practice)
      - name: Verify Java & Maven
        run: |
          java -version
          mvn -version

      # 4️⃣ Run Maven tests (Cucumber + Selenium)
      - name: Build and run tests
        run: mvn clean test

      # 5️⃣ Upload Maven dependency graph (optional but recommended)
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v4
